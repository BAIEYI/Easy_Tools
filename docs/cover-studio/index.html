<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>封面工坊 2.3</title><style>*{box-sizing:border-box}body{margin:0;background:#10131a;color:#e9edf5;font:15px 'Microsoft YaHei',sans-serif}header{padding:24px 32px;border-bottom:1px solid #303643;display:flex;justify-content:space-between}h1{margin:0;font-size:24px}small,p{color:#a4afc2}main{display:grid;grid-template-columns:330px 1fr;gap:28px;padding:28px}aside,section{background:#191e29;border:1px solid #303643;border-radius:16px;padding:22px}label{display:block;margin:14px 0 6px;color:#bac4d7}input,textarea,select,button{width:100%;background:#252d3c;color:white;border:1px solid #465169;padding:10px;border-radius:8px;font:inherit}textarea{height:62px}button{cursor:pointer;margin-top:10px;background:#7661ed;border:0}button.secondary{background:#30394b}.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}.preview{display:flex;align-items:center;justify-content:center;min-height:400px;background:#0c1017;padding:18px;border-radius:12px;position:relative}canvas{max-width:100%;max-height:65vh;object-fit:contain}.safe{outline:2px dashed #6ce6bd;outline-offset:-25px}#thumb{max-width:180px;max-height:140px}#status{white-space:pre-wrap;line-height:1.6;color:#a8e1d0}input[type=checkbox]{width:auto}h2{font-size:16px}@media(max-width:850px){main{grid-template-columns:1fr;padding:12px}}[hidden]{display:none!important}.compareGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.compareCard{margin:0;background:#101620;border:2px solid #303643;padding:12px;text-align:left}.compareCard.selected{border-color:#ac97ff}.compareCard span{display:block;color:#bdc9df;margin-bottom:12px}.compareCard>div{height:310px;display:flex;justify-content:center;align-items:center}.compareCard canvas{max-width:100%;max-height:100%;width:auto;height:auto}.compareCard:focus-visible{outline:3px solid #6ce6bd}@media(max-width:600px){.compareGrid{grid-template-columns:1fr}} main{align-items:start}section{min-width:0}aside{padding:20px}textarea{height:52px}.belowPreview{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-top:22px}.controlPanel{background:#141a25;border:1px solid #303643;border-radius:12px;padding:18px}.controlPanel h2{margin-top:0}output{float:right;color:#c4b6ff}details{margin:18px 0;padding:12px;background:#101620;border-radius:10px}summary{cursor:pointer}.compareCard>div{height:260px}@media(max-width:1100px){.belowPreview{grid-template-columns:1fr}} </style>
<header><h1>封面工坊 <small>2.3 · 离线版</small></h1><small>让主题先被看见</small></header><main><aside>
<label>引导语</label><textarea id="intro">3分钟看懂</textarea><label>核心主题 · 最大字号</label><textarea id="topic">神经网络</textarea><label>补充说明</label><textarea id="detail">到底在干嘛</textarea><label>系列 / 期数</label><input id="subtitle" value="深度学习科普 · 第14期">
<label>背景素材</label><select id="bg"></select><button id="randomBg">生成全新随机背景</button><p id="seedInfo"></p><label>构图</label><select id="template"><option value="type">大字型</option><option value="nodes">节点网络</option><option value="orbit">轨道星环</option><option value="branch">分支连接</option><option value="constellation">星座折线</option><option value="dots">点阵</option></select><p>节点装饰仅增加连线图案，不会根据标题生成内容示意图。</p><label>主题色</label><input type="color" id="accent" value="#ac97ff"><button id="randomAccent" class="secondary">按背景随机配色</button><label>字体</label><select id="font"><option>Microsoft YaHei</option><option>SimHei</option><option>Arial</option></select><p id="fontStatus"></p>
<details><summary>高级自定义 · 描边 / 标红</summary><label>黑色外描边</label><select id="outline"><option value="off">关闭</option><option value="on">开启</option></select><label>描边粗细（字号 %）</label><input id="strokeSize" type="range" min="1" max="8" value="3"><label>文字基础颜色</label><input type="color" id="textColor" value="#ffffff"><label>标红的字 / 词（用 | 分隔）</label><input id="redWords" placeholder="神经网络|看懂"><label>强调颜色</label><input type="color" id="redColor" value="#ed3434"><p>匹配引导语、主题和补充说明；跨行的词也能标红。开启描边后，普通文字使用上面的基础颜色。</p></details><label>换行模式</label><select id="wrap"><option value="auto">自动适配（标点处优先）</option><option value="manual">强制换行（换行或 | 分隔）</option></select>
</aside><section><label>预览模式</label><select id="view"><option value="all">四图对照</option><option value="single">单图放大</option></select><p>点击下方比例卡片，调整该比例的字号与位置。</p><h2 id="sizeLabel"></h2><div id="singleView" class="preview" hidden><canvas id="canvas"></canvas></div><div id="allView" class="compareGrid"><button class="compareCard" id="card0" type="button"><span>16:9 · 1920 × 1080</span><div><canvas id="compare0"></canvas></div></button><button class="compareCard" id="card1" type="button"><span>9:16 · 1080 × 1920</span><div><canvas id="compare1"></canvas></div></button><button class="compareCard" id="card2" type="button"><span>4:3 · 1600 × 1200</span><div><canvas id="compare2"></canvas></div></button><button class="compareCard" id="card3" type="button"><span>3:4 · 1200 × 1600</span><div><canvas id="compare3"></canvas></div></button></div><div class="belowPreview"><div class="controlPanel"><h2>当前比例 · 排版调整</h2><label>当前比例</label><select id="ratio"><option>16:9</option><option>9:16</option><option>4:3</option><option>3:4</option></select><label>本比例整体字号 <output id="scaleValue"></output></label><input id="scale" type="range" min="80" max="300" value="100"><label>核心主题单独放大 <output id="topicValue"></output></label><input id="topicScale" type="range" min="100" max="220" value="100"><p id="fitInfo"></p><label>本比例垂直位置 <output id="positionValue"></output></label><input id="position" type="range" min="0" max="100" value="50"><div class="row"><button class="secondary" id="alignTop">靠上</button><button class="secondary" id="alignCenter">居中</button><button class="secondary" id="alignBottom">靠下</button></div><label><input type="checkbox" id="safe"> 显示安全区参考（不导出）</label>
</div><div class="controlPanel"><h2>导出与项目</h2><button id="export">导出当前 PNG</button><button id="batch">导出全部四种比例</button><button class="secondary" id="directory">选择导出文件夹</button><div class="row"><button class="secondary" id="save">保存项目</button><button class="secondary" id="load">打开项目</button></div><input hidden type="file" id="file" accept=".json"><p id="status" role="status">正在加载背景…</p></div></div><h2>小缩略图检查</h2><canvas id="thumb"></canvas><p>核心主题应一眼可读。垂直位置覆盖顶部至底部的可用空间，底部为系列文字预留位置；长标题会自动缩小。</p></section></main><script src="assets.js"></script><script src="app.js"></script></html>
